  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <style>
    :root {
      --bg: #f7f1e6;
      --ink: #2a2118;
      --muted: #7a6b5a;
      --accent: #b5532c;
      --accent-ink: #fff;
      --card: #fffaf1;
      --line: #e6dccb;
      --hl: #ffe3a3;
      --good: #2f7d4f;
      --bad: #b23a3a;
      --shadow: 0 6px 24px rgba(60, 40, 20, .08);
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #15110d; --ink: #f1e8d8; --muted: #a79a86; --accent: #f0a06b; --accent-ink: #1b130c;
        --card: #1f1913; --line: #3a2f24; --hl: #5a4420; --good: #7fcf9b; --bad: #f08a8a;
        --shadow: 0 6px 24px rgba(0, 0, 0, .4);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #15110d; --ink: #f1e8d8; --muted: #a79a86; --accent: #f0a06b; --accent-ink: #1b130c;
      --card: #1f1913; --line: #3a2f24; --hl: #5a4420; --good: #7fcf9b; --bad: #f08a8a;
      --shadow: 0 6px 24px rgba(0, 0, 0, .4);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
    body { min-height: 100vh; line-height: 1.6; overflow-x: hidden; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    /* No blue box on tap (Android's default highlight): everything tappable opts out, and a quick fade on press says it was touched instead. */
    html, a, button, summary, label, [role="button"] { -webkit-tap-highlight-color: transparent; }
    a:active, button:active, [role="button"]:active { opacity: .7; }
    [hidden] { display: none !important; }

    #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 30; }

    /* Top bar */
    .topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .topbar-in { max-width: 920px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand { font-family: var(--serif); font-weight: 900; font-size: 1.35rem; text-decoration: none; letter-spacing: -.02em; margin-right: auto; display: inline-flex; align-items: center; gap: 8px; }
    .brand b { font-weight: inherit; }
    .brand img { width: 34px; height: auto; transition: transform .3s; }
    .brand:hover img { transform: rotate(-8deg) scale(1.08); }
    .brand span { color: var(--accent); }
    .nav { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav a, .icon-btn { text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: .9rem; font-weight: 600; color: var(--muted); border: 1px solid transparent; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .nav a:hover, .icon-btn:hover { color: var(--ink); background: var(--card); border-color: var(--line); }
    .nav a[aria-current="page"] { color: var(--accent-ink); background: var(--accent); }
    .icon-btn { padding: 6px 8px; }
    svg.i { width: 1em; height: 1em; flex: none; }

    main { max-width: 760px; margin: 0 auto; padding: 28px 16px 120px; }
    .view { animation: rise .35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

    .page-head { margin: 8px 0 24px; }
    .page-head h1 { font-family: var(--serif); font-size: clamp(2rem, 6vw, 2.8rem); margin: 0; letter-spacing: -.02em; line-height: 1.1; }
    .page-head p { color: var(--muted); margin: 8px 0 0; }
    .kicker { color: var(--accent); font-weight: 700; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; }

    .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .pill, .btn { text-decoration: none; font-weight: 600; font-size: .88rem; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; display: inline-flex; align-items: center; gap: 6px; transition: transform .15s, background .15s; }
    .pill:hover, .btn:hover { transform: translateY(-1px); }
    .pill[aria-current="true"], .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }

    /* Home */
    .hero { text-align: center; padding: 24px 0 8px; }
    .hero h1 { font-family: var(--serif); font-weight: 900; font-size: clamp(3rem, 12vw, 5.5rem); margin: 6px 0; letter-spacing: -.04em; line-height: 1; }
    .hero h1 span { color: var(--accent); }
    .hero p { color: var(--muted); max-width: 520px; margin: 12px auto 0; }
    .hero-logo { width: clamp(130px, 34vw, 190px); height: auto; display: block; margin: 0 auto 14px; filter: var(--logo-edge) var(--logo-drop); animation: bob 5s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-1.5deg); } }
    /* Soft edge + glow around the logo, tuned per theme so it shows on both backgrounds */
    :root {
      --logo-edge: drop-shadow(0 0 1px rgba(42, 33, 24, .35)) drop-shadow(0 0 6px rgba(181, 83, 44, .3));
      --logo-drop: drop-shadow(0 10px 18px rgba(60, 40, 20, .18));
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --logo-edge: drop-shadow(0 0 1px rgba(241, 232, 216, .55)) drop-shadow(0 0 6px rgba(240, 160, 107, .25));
        --logo-drop: drop-shadow(0 10px 18px rgba(0, 0, 0, .4));
      }
    }
    :root[data-theme="dark"] {
      --logo-edge: drop-shadow(0 0 1px rgba(241, 232, 216, .55)) drop-shadow(0 0 6px rgba(240, 160, 107, .25));
      --logo-drop: drop-shadow(0 10px 18px rgba(0, 0, 0, .4));
    }
    .brand img { filter: var(--logo-edge); }
    .daily { padding: 26px; margin: 32px 0; position: relative; overflow: hidden; }
    .daily .quote { font-family: var(--serif); font-size: clamp(1.35rem, 4.5vw, 1.8rem); line-height: 1.35; margin: 10px 0 16px; }
    .daily .poem { font-family: var(--serif); font-style: italic; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 14px; margin: 0 0 16px; }
    .daily .ref { font-size: .8rem; color: var(--muted); font-weight: 600; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .door { padding: 18px; text-decoration: none; transition: transform .2s, border-color .2s; display: block; }
    .door:hover { transform: translateY(-3px) rotate(-.5deg); border-color: var(--accent); }
    .door .emo { font-size: 1.6rem; color: var(--accent); display: inline-flex; }
    .door h3 { font-family: var(--serif); margin: 6px 0 2px; font-size: 1.2rem; }
    .door p { margin: 0; color: var(--muted); font-size: .85rem; line-height: 1.45; }
    .stats { display: flex; justify-content: center; gap: 28px; margin: 36px 0 0; color: var(--muted); font-size: .85rem; text-align: center; }
    .stats b { display: block; font-family: var(--serif); font-size: 1.8rem; color: var(--ink); }

    /* Kitab */
    .bab { margin: 32px 0 12px; scroll-margin-top: 80px; }
    .bab h2, .bab h3 { font-family: var(--serif); font-size: 1.65rem; margin: 0; line-height: 1.2; }
    .bait { padding: 16px 20px; margin: 14px 0; scroll-margin-top: 90px; transition: border-color .3s; }
    .bait.active { border-color: var(--accent); }
    .bait header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .bait .num { font-size: .75rem; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-decoration: none; }
    .bait .num:hover { color: var(--accent); }
    .verse { display: block; font-family: var(--serif); font-size: 1.12rem; padding: 3px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; transition: background .2s; -webkit-tap-highlight-color: transparent; }
    .verse:hover { background: color-mix(in srgb, var(--hl) 55%, transparent); }
    .verse.sel { background: var(--hl); }
    .verse sup { font-family: var(--sans); font-size: .62rem; color: var(--muted); margin-right: 6px; font-weight: 700; }
    details.asli { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
    details.asli summary { cursor: pointer; font-size: .82rem; font-weight: 600; color: var(--accent); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
    details.asli summary::-webkit-details-marker { display: none; }
    details.asli[open] summary { margin-bottom: 4px; }
    details.asli p { margin: 0; font-size: .95rem; }
    .used { font-size: .8rem; color: var(--muted); margin-top: 8px; }
    .used svg.i { vertical-align: -2px; margin-right: 4px; }
    .used a { color: var(--accent); }

    .selbar { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 160%); z-index: 25; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 18px; display: flex; align-items: center; gap: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: transform .3s cubic-bezier(.2,.9,.3,1.2); max-width: calc(100vw - 32px); }
    .selbar.show { transform: translate(-50%, 0); }
    .selbar b { font-size: .9rem; margin-right: 6px; white-space: nowrap; }
    .selbar button { background: none; border: 0; color: inherit; cursor: pointer; padding: 8px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
    .selbar button:hover { background: color-mix(in srgb, var(--bg) 18%, transparent); }

    /* Kisah list */
    .story-card { display: block; padding: 22px; margin: 16px 0; text-decoration: none; transition: transform .2s, border-color .2s; }
    .story-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .story-card h2 { font-family: var(--serif); font-size: 1.45rem; margin: 4px 0 8px; line-height: 1.2; }
    .story-card p { margin: 0 0 12px; color: var(--muted); font-size: .95rem; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--hl); }

    /* Kisah reader */
    .back { text-decoration: none; color: var(--muted); font-size: .9rem; font-weight: 600; }
    .back:hover { color: var(--accent); }
    .reader h1 { font-family: var(--serif); font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.15; margin: 8px 0 8px; letter-spacing: -.02em; }
    .reader .meta { color: var(--muted); font-size: .85rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
    .content p { font-family: var(--serif); font-size: 1.12rem; line-height: 1.8; margin: 0 0 1.1em; }
    .content p:has(> em:first-child) { padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--card); border-radius: 0 14px 14px 0; }
    .content em { color: var(--accent); }
    .content em .ctx { color: var(--muted); font-style: normal; font-size: .92em; }
    .content hr { display: none; }
    .ref-chip { font-family: var(--sans); font-size: .76rem; font-weight: 700; cursor: pointer; border: 0; border-radius: 999px; padding: 2px 10px; margin-left: 4px; background: var(--hl); color: var(--ink); transition: transform .15s; white-space: nowrap; vertical-align: 2px; }
    .ref-chip:hover { transform: scale(1.06); }
    .ref-chip[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); }
    .ref-panel { font-family: var(--sans); margin: -6px 0 18px; padding: 14px 18px; animation: rise .25s ease both; }
    .ref-panel .verses-q { font-family: var(--serif); font-size: 1rem; line-height: 1.6; margin: 6px 0 10px; }
    .ref-panel .asli-q { font-size: .9rem; margin: 0 0 10px; }
    .ref-panel .asli-q span { color: var(--muted); font-weight: 600; }
    .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
    .pager a { padding: 14px 16px; text-decoration: none; font-size: .85rem; color: var(--muted); }
    .pager a b { display: block; color: var(--ink); font-family: var(--serif); font-size: 1rem; line-height: 1.3; margin-top: 2px; }
    .pager a.next { text-align: right; grid-column: 2; }
    .pager a:hover { border-color: var(--accent); }

    /* Kata Bapak (flip cards) */
    .flip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 16px; }
    .flip { perspective: 900px; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
    .flip-in { display: grid; transition: transform .55s cubic-bezier(.3,.8,.3,1); transform-style: preserve-3d; height: 100%; }
    .flip.on .flip-in { transform: rotateY(180deg); }
    .face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-height: 180px; }
    .face .lbl { font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .face.front q { font-family: var(--serif); font-size: 1.12rem; line-height: 1.4; quotes: '“' '”'; flex: 1; }
    .face.back { transform: rotateY(180deg); background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .face.back .lbl { color: color-mix(in srgb, var(--bg) 60%, transparent); }
    .face.back div.p { font-family: var(--serif); font-style: italic; font-size: .98rem; line-height: 1.5; flex: 1; }
    .face .hint { font-size: .75rem; color: var(--muted); }
    .face.back a { font-size: .78rem; font-weight: 700; color: var(--accent); }

    /* Tebak */
    .quiz { padding: 24px; }
    .quiz .score { display: flex; gap: 16px; font-size: .85rem; color: var(--muted); margin-bottom: 14px; }
    .quiz .score b { color: var(--ink); }
    .quiz .poem { font-family: var(--serif); font-size: 1.2rem; line-height: 1.6; margin: 8px 0 20px; }
    .opts { display: grid; gap: 10px; }
    .opt { text-align: left; cursor: pointer; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-size: .98rem; transition: transform .15s, border-color .15s; }
    .opt:hover:not(:disabled) { transform: translateX(3px); border-color: var(--accent); }
    .opt:disabled { cursor: default; }
    .opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--bg)); animation: pop .35s; }
    .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--bg)); animation: shake .35s; }
    .verdict { margin: 16px 0 0; font-weight: 600; min-height: 1.6em; }
    .verdict svg.i { vertical-align: -2px; color: var(--accent); }
    @keyframes pop { 50% { transform: scale(1.03); } }
    @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    .toast { position: fixed; left: 50%; top: 70px; transform: translate(-50%, -30px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .9rem; transition: transform .3s, opacity .3s; z-index: 40; pointer-events: none; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .loading, .error { text-align: center; color: var(--muted); padding: 60px 0; }
    footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 40px; }

    @media (max-width: 520px) {
      .topbar-in { gap: 6px; }
      .nav { width: 100%; order: 3; justify-content: space-between; }
      .nav a { padding: 6px 9px; font-size: .84rem; }
      .nav .wide { display: none; }
      .bait, .daily, .quiz { padding: 16px; }
      .verse { font-size: 1.04rem; }
      .content p { font-size: 1.05rem; }
      .stats { gap: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="progress"></div>

  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/"><img src="assets/logo.png" alt="" width="34" height="29"><b>abim<span>i</span>sme</b></a>
      <button class="icon-btn" id="theme" aria-label="Ganti tema"></button>
      <nav class="nav" aria-label="Utama">

        <a href="#/acak" data-nav="acak" title="Bait acak" aria-label="Bait acak"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 18h.01"/><path d="M10 14h.01"/><path d="M15 6h.01"/><path d="M18 9h.01"/></svg><span class="wide">Acak</span></a>

  <main id="view"><div class="loading">Memuat nasihat…</div></main>

  <div class="selbar" id="selbar" role="region" aria-label="Bait terpilih">

    <button id="sel-copy"></button>
    <button id="sel-share"></button>
    <button id="sel-close" aria-label="Batal pilih"></button>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    const $ = (sel, root = document) => root.querySelector(sel);
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    };

    const ICON = {
      share: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>',
      copy: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',

      flip: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>',
      compass: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/><circle cx="12" cy="12" r="10"/></svg>',
      close: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
      thumbsUp: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>',
      flame: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
    };
    $('#sel-copy').innerHTML = `${ICON.copy} Salin`;
    $('#sel-share').innerHTML = `${ICON.share} Bagikan`;
    $('#sel-close').innerHTML = ICON.close;

    // Toast, copy, share
    const toast = $('#toast');
    let toastTimer;
    function say(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }
    async function copy(text, msg = 'Disalin') {
      try { await navigator.clipboard.writeText(text); say(msg); }
      catch { say('Gagal menyalin'); }
    }
    const linkTo = (hash) => `${location.origin}${location.pathname}${hash}`;
    async function share(hash, title) {
      const url = linkTo(hash);
      if (navigator.share && matchMedia('(pointer: coarse)').matches) {
        try { await navigator.share({ title, url }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      copy(url, 'Tautan disalin — tinggal tempel');
    }

    // Theme
    const themeBtn = $('#theme');
    const isDark = () => document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    function paintTheme() { themeBtn.innerHTML = isDark() ? ICON.sun : ICON.moon; }
    if (store.get('abim-theme')) document.documentElement.dataset.theme = store.get('abim-theme');
    paintTheme();
    themeBtn.addEventListener('click', () => {
      const next = isDark() ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      store.set('abim-theme', next);
      paintTheme();
    });

    // Reading progress
    const bar = $('#progress');
    const updateBar = () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = max > 0 ? `${(scrollY / max) * 100}%` : '0';
    };
    addEventListener('scroll', updateBar, { passive: true });

    // Parsing (jilid:bab:bait:baris)
    const slugify = (s) => s.toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
    const REF_RE = /\((?:(\d+):)?(\d+):(\d+):(\d+)(?:[–-](\d+))?\)/;

    function parseKitab(md) {
      const jilids = [];
      const babs = [];
      let jilid = null;
      let bab = null;
      for (const raw of md.split('\n')) {
        const line = raw.trim();
        let m;
        if ((m = line.match(/^##\s+Jilid\s+(\d+):\s*(.+)$/))) {
          jilid = { no: m[1], title: m[2], babs: [] };
          jilids.push(jilid);
        } else if ((m = line.match(/^#{2,3}\s+Bab\s+(\d+):\s*(.+)$/))) {
          if (!jilid) {
            jilid = { no: '1', title: 'Jilid 1', babs: [] };
            jilids.push(jilid);
          }
          bab = { jilid: jilid.no, jilidTitle: jilid.title, no: m[1], title: m[2], baits: [] };
          jilid.babs.push(bab);
          babs.push(bab);
        } else if (bab && (m = line.match(/^(?:(\d+):)?(\d+):(\d+):(\d+)\s+(.+)$/))) {
          const jNo = m[1] || bab.jilid;
          const babNo = m[2];
          const baitNo = m[3];
          const barisNo = Number(m[4]);
          const text = m[5];
          let bait = bab.baits.find(b => b.no === baitNo);
          if (!bait) bab.baits.push(bait = { jilid: jNo, bab: babNo, no: baitNo, verses: [] });
          bait.verses.push({ sub: barisNo, text });
        }
      }
      return { jilids, babs };
    }

    function parseKutipan(md) {
      const map = new Map();
      for (const raw of md.split('\n')) {
        const m = raw.trim().match(/^(?:(\d+):)?(\d+):(\d+)\s+(.+)$/);
        if (m) {
          map.set(`${m[2]}:${m[3]}`, m[4]);
          if (m[1]) map.set(`${m[1]}:${m[2]}:${m[3]}`, m[4]);
        }
      }
      return map;
    }

    function parseKisah(md, getJilidOfBab) {
      return md.split(/^## Kisah: /m).slice(1).map(chunk => {
        const [title, ...rest] = chunk.split('\n');
        const body = rest.join('\n').trim().replace(/\n-{3,}\s*$/, '').trim();
        const refs = [...body.matchAll(new RegExp('`' + REF_RE.source + '`', 'g'))]
          .map(([, jilid, bab, bait, from, to]) => ({
            jilid: jilid || getJilidOfBab(bab),
            bab,
            bait,
            from: Number(from),
            to: Number(to ?? from),
          }));
        const who = body.match(/\*\((\p{Lu}\p{Ll}+),\)/u)?.[1];
        const first = body.split(/\n\s*\n/)[0].replace(/[*_`]/g, '');
        return { title: title.trim(), slug: slugify(title), body, refs, who, excerpt: first.length > 170 ? first.slice(0, 167).trimEnd() + '…' : first };
      });
    }

    const S = { jilids: [], babs: [], baits: [], kutipan: new Map(), stories: [], usedIn: new Map() };
    const findBab = (bab) => S.babs.find(b => b.no === String(bab));
    const jilidOfBab = (bab) => findBab(bab)?.jilid ?? '1';
    const findBait = (bab, bait) => S.baits.find(b => b.bab === String(bab) && b.no === String(bait));
    const babTitle = (no) => findBab(no)?.title ?? '';
    const baitCode = (b) => `${b.jilid}:${b.bab}:${b.no}`;
    const baitHash = (b) => `#/kitab/${b.jilid}/${b.bab}/${b.no}`;
    const refText = (r) => `${r.jilid || jilidOfBab(r.bab)}:${r.bab}:${r.bait}:${r.from}${r.to !== r.from ? '–' + r.to : ''}`;
    const refHash = (r) => `#/kitab/${r.jilid || jilidOfBab(r.bab)}/${r.bab}/${r.bait}/${r.from}${r.to !== r.from ? '-' + r.to : ''}`;
    const versesOf = (r) => findBait(r.bab, r.bait)?.verses.filter(v => v.sub >= r.from && v.sub <= r.to) ?? [];

    // Views
    const view = $('#view');
    const setView = (html, title) => {
      view.innerHTML = `<div class="view">${html}</div>`;
      document.title = title ? `${title} · abimisme` : 'abimisme — Kitab Nasihat Bapak-Bapak';
    };

    const dailyBaits = () => S.baits.filter(b => b.bab === '1' || b.bab === '2');

    function viewHome() {
      const pool = dailyBaits();
      const today = pick(pool.length ? pool : S.baits);
      setView(`
        <section class="hero">
          <img class="hero-logo" src="assets/logo.png" alt="Logo abimisme" width="640" height="538">
          <div class="kicker">Kitab Nasihat Bapak-Bapak</div>
          <h1>abim<span>i</span>sme</h1>
          <p>Nasihat bapak-bapak Indonesia; Terkadang bijak, terkadang nyeleneh, dan terkadang bikin “iya juga ya”. Dikompilasi jadi kitab puitis, lengkap dengan kisahnya.</p>
        </section>
        <section class="daily card" id="daily"></section>
        <div class="doors">
          <a class="door card" href="#/kitab"><div class="emo">${ICON.scroll}</div><h3>Kitab</h3><p>Jilid, bab, bait, dan baris. Pilih baris, bagikan tautannya.</p></a>
          <a class="door card" href="#/kisah"><div class="emo">${ICON.coffee}</div><h3>Kisah</h3><p>Cerita Pak Abi dan anak-anaknya, lengkap dengan rujukan.</p></a>
          <a class="door card" href="#/kata-bapak"><div class="emo">${ICON.quote}</div><h3>Kutipan</h3><p>Kutipan aslinya. Balik kartunya, lihat versi kitabnya.</p></a>
          <a class="door card" href="#/tebak"><div class="emo">${ICON.target}</div><h3>Tebak</h3><p>Bait puitis ini aslinya bapak ngomong apa?</p></a>
        </div>
        <div class="stats">
          <div><b>${S.jilids.length}</b>jilid</div>
          <div><b>${S.babs.length}</b>bab</div>
          <div><b>${S.baits.length}</b>nasihat</div>
          <div><b>${S.stories.length}</b>kisah</div>
        </div>`);
      renderDaily(today, 'Nasihat hari ini');
    }

    function renderDaily(b, label = 'Nasihat hari ini') {
      const box = $('#daily');
      const hash = baitHash(b);
      const code = baitCode(b);
      box.innerHTML = `
        <div class="kicker">${label}</div>
        <p class="quote">${b.verses.map(v => esc(v.text)).join(' ')}</p>
        <p class="poem" hidden>“${esc(S.kutipan.get(`${b.bab}:${b.no}`) ?? '')}”</p>
        <div class="row">
          <button class="btn primary" data-act="poem">${ICON.quote} Kutipan</button>
          <button class="btn" data-act="again">${ICON.dice} Lainnya</button>
          <button class="btn" data-share="${hash}" data-title="Nasihat ${code}">${ICON.share} Bagikan</button>
          <a class="ref" href="${hash}" style="margin-left:auto">${esc(babTitle(b.bab))} · ${code} →</a>
        </div>`;
      box.querySelector('[data-act="poem"]').onclick = (e) => {
        const poem = box.querySelector('.poem');
        poem.hidden = !poem.hidden;
        e.currentTarget.innerHTML = poem.hidden ? `${ICON.quote} Kutipan` : `${ICON.quote} Sembunyikan`;
      };
      box.querySelector('[data-act="again"]').onclick = () => {
        const pool = dailyBaits();
        const src = pool.length ? pool : S.baits;
        let next;
        do next = pick(src); while (src.length > 1 && next === b);
        renderDaily(next, label);
      };
    }

    function baitHTML(b) {
      const asli = S.kutipan.get(`${b.bab}:${b.no}`);
      const used = S.usedIn.get(`${b.bab}:${b.no}`) ?? [];
      const code = baitCode(b);
      const hash = baitHash(b);
      return `
        <article class="bait card" id="b-${b.bab}-${b.no}" data-jilid="${b.jilid}" data-bab="${b.bab}" data-bait="${b.no}">
          <header>
            <a class="num" href="${hash}">${code}</a>
            <button class="icon-btn" data-share="${hash}" data-title="Kitab ${code}" aria-label="Bagikan bait ${code}">${ICON.share}</button>
          </header>
          ${b.verses.map(v => `<span class="verse" id="v-${b.bab}-${b.no}-${v.sub}" data-sub="${v.sub}"><sup>${v.sub}</sup>${esc(v.text)}</span>`).join('')}
          ${asli ? `<details class="asli"><summary>${ICON.quote} Kata Bapak aslinya</summary><p>“${esc(asli)}”</p></details>` : ''}
          ${used.length ? `<div class="used">${ICON.book} Muncul di ${used.map(s => `<a href="#/kisah/${s.slug}">${esc(s.title)}</a>`).join(', ')}</div>` : ''}
        </article>`;
    }

    function resolveKitabParams(rest) {
      if (!rest.length) return { jilidNo: '1', babNo: null, baitNo: null, range: null };
      if (rest.length === 1) {
        const jNo = rest[0].replace(/^jilid-?/i, '');
        return { jilidNo: jNo || '1', babNo: null, baitNo: null, range: null };
      }
      if (rest.length === 2) {
        const [babNo, baitNo] = rest;
        return { jilidNo: jilidOfBab(babNo), babNo, baitNo, range: null };
      }
      if (rest.length === 3) {
        // Either [jilidNo, babNo, baitNo] or legacy [babNo, baitNo, range]
        if (S.jilids.some(j => j.no === rest[0]) && findBait(rest[1], rest[2]) && !rest[2].includes('-')) {
          return { jilidNo: rest[0], babNo: rest[1], baitNo: rest[2], range: null };
        }
        return { jilidNo: jilidOfBab(rest[0]), babNo: rest[0], baitNo: rest[1], range: rest[2] };
      }
      const [jilidNo, babNo, baitNo, range] = rest;
      return { jilidNo, babNo, baitNo, range };
    }

    function viewKitab(rest) {
      const { jilidNo, babNo, baitNo, range } = resolveKitabParams(rest);
      const activeJilidNo = jilidNo || '1';
      const jilids = S.jilids.filter(j => j.no === activeJilidNo);
      if (!jilids.length || (baitNo && !findBait(babNo, baitNo))) return viewNotFound();
      const activeJilid = jilids[0];
      const title = `Jilid ${activeJilid.no}: ${activeJilid.title}`;
      setView(`
        <div class="page-head">
          <div class="kicker">Kitab Nasihat</div>
          <h1>Kitab</h1>
          <p>Ketuk baris untuk memilih (ketuk baris lain di bait yang sama untuk memperluas), lalu salin atau bagikan.</p>
        </div>
        <div class="pills">
          ${S.jilids.map(j => `<a class="pill" href="#/kitab/${j.no}" aria-current="${j.no === activeJilidNo}">Jilid ${j.no}: ${esc(j.title)}</a>`).join('')}
        </div>
        ${jilids.map(j => `
          <div class="jilid-group" id="jilid-${j.no}">
            ${j.babs.map(bab => `
              <section class="bab" id="bab-${bab.no}">
                <div class="kicker">Jilid ${bab.jilid} · Bab ${bab.no}</div>
                <h3>${esc(bab.title)}</h3>
                ${bab.baits.map(baitHTML).join('')}
              </section>`).join('')}
          </div>`).join('')}`, baitNo ? `Kitab ${jilidNo}:${babNo}:${baitNo}` : title);

      sel.base = `#/kitab/${activeJilidNo}`;
      if (baitNo) {
        const b = findBait(babNo, baitNo);
        const [from, to] = (range ?? '').split('-').map(Number);
        const subs = b.verses.map(v => v.sub);
        const lo = from || subs[0];
        const hi = to || from || subs[subs.length - 1];
        setSelection(b.jilid, babNo, baitNo, Math.min(lo, hi), Math.max(lo, hi), false);
        const card = $(`#b-${babNo}-${baitNo}`);
        const asli = card.querySelector('details');
        if (asli) asli.open = true;
        requestAnimationFrame(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }));
        return true;
      }
    }

    // Verse selection
    const selbar = $('#selbar');
    const sel = { jilid: null, bab: null, bait: null, from: 0, to: 0, base: '#/kitab' };
    function setSelection(jilid, bab, bait, from, to, updateUrl = true) {
      Object.assign(sel, { jilid, bab, bait, from, to });
      document.querySelectorAll('.verse.sel').forEach(el => el.classList.remove('sel'));
      document.querySelectorAll('.bait.active').forEach(el => el.classList.remove('active'));
      if (!bab) {
        selbar.classList.remove('show');
        if (updateUrl) history.replaceState(null, '', sel.base);
        return;
      }
      for (let s = from; s <= to; s++) $(`#v-${bab}-${bait}-${s}`)?.classList.add('sel');
      $(`#b-${bab}-${bait}`)?.classList.add('active');
      $('#sel-ref').textContent = refText(sel);
      selbar.classList.add('show');
      if (updateUrl) history.replaceState(null, '', refHash(sel));
    }
    $('#sel-close').onclick = () => setSelection(null);
    $('#sel-copy').onclick = () => {
      const text = versesOf(sel).map(v => v.text).join(' ');
      copy(`${text}\n— Kitab Abi ${refText(sel)}\n${linkTo(refHash(sel))}`, `Disalin ${refText(sel)}`);
    };
    $('#sel-share').onclick = () => share(refHash(sel), `Kitab Abi ${refText(sel)}`);

    function onVerseClick(el) {
      const card = el.closest('.bait');
      const { jilid, bab, bait } = card.dataset;
      const sub = Number(el.dataset.sub);
      const same = sel.bab === bab && sel.bait === bait;
      if (!same) return setSelection(jilid, bab, bait, sub, sub);
      if (sel.from === sel.to && sel.from === sub) return setSelection(null);
      if (sub >= sel.from && sub <= sel.to) return setSelection(jilid, bab, bait, sub, sub);
      setSelection(jilid, bab, bait, Math.min(sel.from, sub), Math.max(sel.to, sub));
    }

    function viewKisahList() {
      setView(`
        <div class="page-head">
          <div class="kicker">Kisah-kisah Bapak</div>
          <h1>Kisah</h1>
          <p>Cerita sehari-hari Pak Abi. Setiap nasihat merujuk ke bait dan barisnya di kitab.</p>
        </div>
        ${S.stories.map((s, i) => `
          <a class="story-card card" href="#/kisah/${s.slug}">
            <div class="kicker">Kisah ${i + 1}${s.who ? ` · bersama ${esc(s.who)}` : ''}</div>
            <h2>${esc(s.title)}</h2>
            <p>${esc(s.excerpt)}</p>
            <div class="tags">
              <span class="tag">± ${readMins(s.body)} menit</span>
              <span class="tag">${s.refs.length} nasihat</span>
              ${[...new Set(s.refs.map(r => r.jilid))].map(j => `<span class="tag">Jilid ${j}</span>`).join('')}
              ${[...new Set(s.refs.map(r => r.bab))].map(b => `<span class="tag">Bab ${b}</span>`).join('')}
            </div>
          </a>`).join('')}`, 'Kisah');
    }

    const readMins = (text) => Math.max(1, Math.round(text.split(/\s+/).length / 200));

    function viewKisah(slug) {
      const i = S.stories.findIndex(s => s.slug === slug);
      if (i < 0) return viewNotFound();
      const s = S.stories[i];
      const prev = S.stories[i - 1], next = S.stories[i + 1];
      setView(`
        <article class="reader">
          <a class="back" href="#/kisah">← Semua kisah</a>
          <div class="kicker" style="margin-top:18px">Kisah ${i + 1} dari ${S.stories.length}</div>
          <h1>${esc(s.title)}</h1>
          <div class="meta">
            <span>± ${readMins(s.body)} menit baca</span><span>·</span><span>${s.refs.length} nasihat</span>
            <button class="btn" data-share="#/kisah/${s.slug}" data-title="${esc(s.title)}">${ICON.share} Bagikan</button>
          </div>
          <div class="content">${marked.parse(s.body)}</div>
          <nav class="pager">
            ${prev ? `<a class="card" href="#/kisah/${prev.slug}">← Sebelumnya<b>${esc(prev.title)}</b></a>` : ''}
            ${next ? `<a class="card next" href="#/kisah/${next.slug}">Berikutnya →<b>${esc(next.title)}</b></a>` : ''}
          </nav>
        </article>`, s.title);

      const content = $('.content', view);
      // Grey out the bracketed context that isn't part of the kitab text
      for (const em of content.querySelectorAll('em')) {
        em.innerHTML = em.innerHTML.replace(/\(([^()]+)\)/g, '<span class="ctx">($1)</span>');
      }
      // Turn reference codes like (1:3:3:1–3) into chips that open the verse inline
      for (const code of content.querySelectorAll('code')) {
        const m = code.textContent.match(new RegExp('^' + REF_RE.source + '$'));
        if (!m) continue;
        const r = { jilid: m[1] || jilidOfBab(m[2]), bab: m[2], bait: m[3], from: Number(m[4]), to: Number(m[5] ?? m[4]) };
        const chip = document.createElement('button');
        chip.className = 'ref-chip';
        chip.textContent = refText(r);
        chip.setAttribute('aria-expanded', 'false');
        chip.onclick = () => toggleRefPanel(chip, r);
        code.replaceWith(chip);
      }
    }

    function toggleRefPanel(chip, r) {
      const para = chip.closest('p');
      const open = para.nextElementSibling?.classList.contains('ref-panel') ? para.nextElementSibling : null;
      if (open) { open.remove(); chip.setAttribute('aria-expanded', 'false'); return; }
      const asli = S.kutipan.get(`${r.bab}:${r.bait}`);
      const panel = document.createElement('div');
      panel.className = 'ref-panel card';
      panel.innerHTML = `
        <div class="kicker">Kitab ${refText(r)} · ${esc(babTitle(r.bab))}</div>
        <div class="verses-q">${versesOf(r).map(v => esc(v.text)).join('<br>')}</div>
        ${asli ? `<p class="asli-q"><span>Kata Bapak:</span> “${esc(asli)}”</p>` : ''}
        <div class="row">
          <a class="btn primary" href="${refHash(r)}">Buka di kitab →</a>
          <button class="btn" data-share="${refHash(r)}" data-title="Kitab Abi ${refText(r)}">${ICON.share} Bagikan</button>
        </div>`;
      para.after(panel);
      chip.setAttribute('aria-expanded', 'true');
    }

    function viewKataBapak([jilidNo]) {
      const activeJilidNo = jilidNo || '1';
      const jilids = S.jilids.filter(j => j.no === activeJilidNo);
      if (!jilids.length) return viewNotFound();
      const babs = jilids.flatMap(j => j.babs);
      setView(`
        <div class="page-head">
          <div class="kicker">Kutipan Asli</div>
          <h1>Kata Bapak</h1>
          <p>Begini bapak-bapak ngomongnya. Ketuk kartu untuk membaliknya ke versi kitab.</p>
        </div>
        <div class="pills">
          ${S.jilids.map(j => `<a class="pill" href="#/kata-bapak/${j.no}" aria-current="${j.no === activeJilidNo}">Jilid ${j.no}: ${esc(j.title)}</a>`).join('')}
          <button class="pill" id="flip-all">${ICON.flip} Balik semua</button>
        </div>
        <div class="flip-grid">
          ${babs.flatMap(bab => bab.baits).filter(b => S.kutipan.has(`${b.bab}:${b.no}`)).map(b => `
            <div class="flip" role="button" tabindex="0" aria-label="Balik kartu ${baitCode(b)}">
              <div class="flip-in">
                <div class="face front card">
                  <div class="lbl"><span>${baitCode(b)}</span><span>${ICON.quote}</span></div>
                  <q>${esc(S.kutipan.get(`${b.bab}:${b.no}`) ?? '')}</q>
                  <div class="hint">ketuk untuk membalik</div>
                </div>
                <div class="face back card">
                  <div class="lbl"><span>Kitab ${baitCode(b)}</span><span>${ICON.scroll}</span></div>
                  <div class="p">${b.verses.map(v => esc(v.text)).join('<br>')}</div>
                  <a href="${baitHash(b)}">Buka di kitab →</a>
                </div>
              </div>
            </div>`).join('')}
        </div>`, `Kata Bapak · Jilid ${jilids[0].no}`);

      const cards = [...view.querySelectorAll('.flip')];
      for (const card of cards) {
        const flip = (e) => { if (!e.target.closest('a')) card.classList.toggle('on'); };
        card.addEventListener('click', flip);
        card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(e); } });
      }
      $('#flip-all').onclick = () => {
        const anyOff = cards.some(c => !c.classList.contains('on'));
        cards.forEach((c, i) => setTimeout(() => c.classList.toggle('on', anyOff), i * 40));
      };
    }

    // Quiz
    const quiz = { score: 0, streak: 0, asked: 0, best: Number(store.get('abim-best') ?? 0) };
    function viewTebak() {
      setView(`
        <div class="page-head">
          <div class="kicker">Permainan</div>
          <h1>Tebak Kata Bapak</h1>
          <p>Bait puitis di bawah ini, aslinya bapak ngomong apa?</p>
        </div>
        <section class="quiz card" id="quiz"></section>`, 'Tebak Kata Bapak');
      nextQuestion();
    }

    function nextQuestion() {
      const box = $('#quiz');
      const q = pick(S.baits);
      const others = shuffle(S.baits.filter(b => b !== q)).slice(0, 3);
      const options = shuffle([q, ...others]);
      box.innerHTML = `
        <div class="score">
          <span>Benar <b>${quiz.score}/${quiz.asked}</b></span>
          <span>Beruntun <b>${quiz.streak}</b></span>
          <span>Rekor <b>${quiz.best}</b></span>
        </div>
        <div class="kicker">Jilid ${q.jilid} · Bab ${q.bab}: ${esc(babTitle(q.bab))}</div>
        <div class="poem">${q.verses.map(v => esc(v.text)).join('<br>')}</div>
        <div class="opts">
          ${options.map(o => `<button class="opt" data-key="${o.bab}:${o.no}">“${esc(S.kutipan.get(`${o.bab}:${o.no}`) ?? '')}”</button>`).join('')}
        </div>
        <p class="verdict" aria-live="polite"></p>
        <div class="row" id="quiz-next" hidden>
          <button class="btn primary">Soal berikutnya →</button>
          <a class="btn" href="${baitHash(q)}">Lihat di kitab</a>
        </div>`;
      const key = `${q.bab}:${q.no}`;
      for (const btn of box.querySelectorAll('.opt')) {
        btn.onclick = () => {
          const right = btn.dataset.key === key;
          quiz.asked++;
          if (right) { quiz.score++; quiz.streak++; } else quiz.streak = 0;
          if (quiz.streak > quiz.best) { quiz.best = quiz.streak; store.set('abim-best', String(quiz.best)); }
          box.querySelectorAll('.opt').forEach(o => {
            o.disabled = true;
            if (o.dataset.key === key) o.classList.add('right');
          });
          if (!right) btn.classList.add('wrong');
          box.querySelector('.verdict').innerHTML = right
            ? pick([`Betul! Bapak bangga. ${ICON.thumbsUp}`, 'Mantap, calon bapak-bapak sejati.', 'Nah, gitu dong. Pinter.', `Benar! ${quiz.streak} beruntun. ${ICON.flame}`])
            : pick(['Salah. Kurang sering dinasihati, ya?', 'Hmm, bukan itu, Nak.', 'Belum tepat. Coba dengarkan bapakmu lagi.']);
          box.querySelector('.score').innerHTML = `<span>Benar <b>${quiz.score}/${quiz.asked}</b></span><span>Beruntun <b>${quiz.streak}</b></span><span>Rekor <b>${quiz.best}</b></span>`;
          const nextRow = $('#quiz-next');
          nextRow.hidden = false;
          nextRow.querySelector('button').onclick = nextQuestion;
        };
      }
    }

    function viewNotFound() {
      setView(`
        <div class="page-head" style="text-align:center;padding:40px 0">
          <div style="font-size:3rem;color:var(--accent)">${ICON.compass}</div>
          <h1>Nyasar, Nak?</h1>
          <p>Tatkala simpang jalan mengaburkan arah, rendahkanlah hati untuk bertanya. <a href="#/kitab/1/1/3/1-2">(1:1:3:1–2)</a></p>
          <p style="margin-top:20px"><a class="btn primary" href="#/">Pulang ke beranda</a></p>
        </div>`, 'Tidak ditemukan');
    }

    // Router
    function route() {
      const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
      const [page, ...rest] = parts;
      if (page === 'acak') {
        const b = pick(S.baits);
        return location.replace(baitHash(b));
      }
      setSelection(null, null, null, 0, 0, false);
      for (const a of document.querySelectorAll('[data-nav]')) {
        a.toggleAttribute('aria-current', a.dataset.nav === page);
        if (a.dataset.nav === page) a.setAttribute('aria-current', 'page');
      }
      let keepsScroll = false;
      if (!page) viewHome();
      else if (page === 'kitab') keepsScroll = viewKitab(rest);
      else if (page === 'kisah') rest[0] ? viewKisah(rest[0]) : viewKisahList();
      else if (page === 'kata-bapak') viewKataBapak(rest);
      else if (page === 'tebak') viewTebak();
      else viewNotFound();
      if (!keepsScroll) scrollTo(0, 0);
      updateBar();
    }

    // Delegated clicks: share buttons and verse selection
    view.addEventListener('click', (e) => {
      const sh = e.target.closest('[data-share]');
      if (sh) return share(sh.dataset.share, sh.dataset.title ?? 'abimisme');
      const verse = e.target.closest('.verse');
      if (verse) onVerseClick(verse);
    });

    // Arrow keys move between stories
    addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey) return;
      if (e.key === 'Escape') setSelection(null);
      if (!location.hash.startsWith('#/kisah/')) return;
      const link = e.key === 'ArrowLeft' ? $('.pager a:not(.next)') : e.key === 'ArrowRight' ? $('.pager a.next') : null;
      if (link) location.hash = link.getAttribute('href');
    });

    // Load
    try {
      const get = (f) => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.text(); });
      const [kitabMd, kisahMd, kutipanMd] = await Promise.all([get('kitab.md'), get('kisah.md'), get('kutipan.md')]);
      const parsedKitab = parseKitab(kitabMd);
      S.jilids = parsedKitab.jilids;
      S.babs = parsedKitab.babs;
      S.baits = S.babs.flatMap(b => b.baits);
      S.kutipan = parseKutipan(kutipanMd);
      S.stories = parseKisah(kisahMd, jilidOfBab);
      for (const s of S.stories) {
        for (const r of s.refs) {
          const k = `${r.bab}:${r.bait}`;
          if (!S.usedIn.has(k)) S.usedIn.set(k, []);
          if (!S.usedIn.get(k).includes(s)) S.usedIn.get(k).push(s);
        }
      }
      addEventListener('hashchange', route);
      route();
    } catch (err) {
      view.innerHTML = '<div class="error">Gagal memuat file. Buka lewat server (bukan file://).</div>';
      console.error(err);
    }
  </script>
</body>
</html>
